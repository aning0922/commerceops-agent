# Independent local synthetic shop. Never combine with the business/PG Compose files.
name: ${WOO_LAB_PROJECT:?prepare a new private lab first}
services:
  database:
    image: mariadb:11.4.13-noble@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    environment:
      MARIADB_DATABASE: woo_lab
      MARIADB_USER: woo_lab
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes: [database:/var/lib/mysql]
    networks: [isolated]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: "no"
  wordpress:
    image: ${WOO_LAB_PROJECT:?}:wordpress
    build:
      context: .
      dockerfile: infrastructure/woo-lab/Dockerfile
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: woo_lab
      WORDPRESS_DB_USER: woo_lab
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISALLOW_FILE_MODS', true);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    secrets: [db_password]
    volumes:
      - wordpress:/var/www/html
      - ${WOO_LAB_PRIVATE_DIR:?}:/run/woo-lab:ro
      - ./tests/fixtures/woocommerce-local/seed.json:/opt/woo-lab/seed.json:ro
    networks: [isolated]
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, 'exit(@fsockopen("127.0.0.1", 80) ? 0 : 1);']
      interval: 2s
      timeout: 3s
      retries: 40
    mem_limit: 1024m
    cpus: 2.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    restart: "no"
  tls:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    entrypoint: [/bin/sh, /opt/woo-lab/tls-start.sh]
    ports: ["127.0.0.1:${WOO_LAB_PORT:?}:8443"]
    volumes:
      - ./infrastructure/woo-lab/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/woo-lab/tls-start.sh:/opt/woo-lab/tls-start.sh:ro
      - ./infrastructure/woo-lab/tls-unprivileged.sh:/opt/woo-lab/tls-unprivileged.sh:ro
    secrets: [server_cert, server_key]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    read_only: true
    networks: [isolated, ingress]
    depends_on: [wordpress]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 32
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: "no"
networks:
  isolated:
    internal: true
    ipam:
      config: [{subnet: "${WOO_LAB_INTERNAL_SUBNET:?}"}]
  ingress:
    ipam:
      config: [{subnet: "${WOO_LAB_INGRESS_SUBNET:?}"}]
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
volumes:
  database: {}
  wordpress: {}
secrets:
  db_password: {file: "${WOO_LAB_PRIVATE_DIR:?}/db_password"}
  db_root_password: {file: "${WOO_LAB_PRIVATE_DIR:?}/db_root_password"}
  server_cert: {file: "${WOO_LAB_PRIVATE_DIR:?}/server.crt"}
  server_key: {file: "${WOO_LAB_PRIVATE_DIR:?}/server.key"}
