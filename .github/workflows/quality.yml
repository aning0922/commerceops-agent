name: Foundation quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.25'
          enable-cache: false
      - name: Fixed project tools with SHA256 verification
        run: python -m scripts.bootstrap_tools
      - name: Secrets gate before dependency installation
        run: python -m scripts.scan_secrets
      - name: Install locked Python environment
        run: uv sync --frozen
      - name: Foundation checks
        run: uv run --frozen python -m scripts.check
