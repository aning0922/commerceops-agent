name: Foundation quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.25'
          enable-cache: false
      - name: Fixed project tools with SHA256 verification
        run: python -m scripts.bootstrap_tools
      - name: Secrets gate before dependency installation
        run: python -m scripts.scan_secrets
      - name: Install locked Python environment
        run: uv sync --frozen
      - name: Foundation checks
        run: uv run --frozen python -m scripts.check
