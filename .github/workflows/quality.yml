name: Foundation quality
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, phase/1-integration]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Register absolute diagnostic deadline
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          directory = Path(".audit")
          directory.mkdir(exist_ok=True)
          (directory / "ci-deadline").write_text(
              (datetime.now(timezone.utc) + timedelta(minutes=33)).isoformat()
          )
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.25'
          enable-cache: false
      - name: Fixed project tools with SHA256 verification
        run: python -m scripts.bootstrap_tools
      - name: Secrets gate before dependency installation
        run: python -m scripts.scan_secrets
      - name: Install locked Python environment
        run: uv sync --frozen
      - name: Real PostgreSQL migration setup constraints and persistence
        shell: bash
        run: |
          uv run --frozen python -m scripts.pg_diagnostic \
            --session ci --round 1 --combined --ci-scope existing --full-smoke --no-child-trace \
            --deadline "$(cat .audit/ci-deadline)"
      - name: Upload only safe existing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        with:
          name: pg-existing-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audit/ci-evidence-existing.json
          if-no-files-found: error
          retention-days: 1
  n01-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Register immutable N01 deadline before checkout
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          stop = (datetime.now(timezone.utc) + timedelta(minutes=23)).isoformat()
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"COMMERCEOPS_N01_STOP_AT_UTC={stop}\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.25'
          enable-cache: false
      - name: Prepare locked N01 production build and Chromium within deadline
        shell: bash
        run: |
          run_before_cleanup() {
            local remaining
            remaining=$(python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          stop = datetime.fromisoformat(os.environ["COMMERCEOPS_N01_STOP_AT_UTC"])
          print(int((stop - datetime.now(timezone.utc)).total_seconds()) - 85)
          PY
            )
            test "$remaining" -gt 0
            timeout --signal=TERM --kill-after=10 "${remaining}s" "$@"
          }
          export PATH="$GITHUB_WORKSPACE/.tools/node/bin:$PATH"
          run_before_cleanup python -m scripts.bootstrap_tools
          run_before_cleanup python -m scripts.scan_secrets
          run_before_cleanup uv sync --frozen
          # Keep the complete foundation gate on this same source and deadline.
          # quality starts its original PG partition without spending this budget first.
          run_before_cleanup uv run --frozen python -m scripts.check
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
          cd "$GITHUB_WORKSPACE/frontend"
          run_before_cleanup npm ci --ignore-scripts
          run_before_cleanup npm run check:toolchain
          run_before_cleanup npm run typecheck
          run_before_cleanup npm run build
          run_before_cleanup npm exec -- playwright install --with-deps chromium
      - name: Run the fixed six actual N01 PG API Web cases
        id: n01
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          export PATH="$GITHUB_WORKSPACE/.tools/node/bin:$PATH"
          umask 077
          private_parent=$(mktemp -d "$RUNNER_TEMP/commerceops-n01-XXXXXX")
          private_directory="$private_parent/c09"
          printf 'private_directory=%s\n' "$private_directory" >> "$GITHUB_OUTPUT"
          rm -f frontend/evidence/p4-c09/n01/live-results.json \
            frontend/evidence/p4-c09/n01/pg-invariants.safe.json \
            frontend/evidence/p4-c09/n01/resource-stop.safe.json
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          job = os.environ["GITHUB_JOB"]
          stop_name = "COMMERCEOPS_N01_STOP_AT_UTC" if job == "n01-web" else "COMMERCEOPS_FRONTEND_STOP_AT_UTC"
          assert job in {"n01-web", "frontend"}
          audit = root / ".audit"
          audit.mkdir(exist_ok=True)
          assert not audit.is_symlink()
          context = {
              "schema_version": "ci-live-failure-binding-v1",
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root, text=True).strip(),
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], cwd=root, text=True).strip(),
              "job": job,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "build_id": (root / "frontend/.next/BUILD_ID").read_text().strip(),
              "registered_at_utc": datetime.now(timezone.utc).isoformat(),
              "stop_at_utc": os.environ[stop_name],
          }
          with (audit / "live-failure-context.safe.json").open("x") as output:
              json.dump(context, output, sort_keys=True)
          (audit / "live-failure-context.safe.json").chmod(0o600)
          PY
          # The C runner reserves 75 seconds for its original children and PG.
          uv run --frozen python -m tests.e2e.web.run_c09_n01 \
            --private-directory "$private_directory" \
            --stop-at-utc "$COMMERCEOPS_N01_STOP_AT_UTC"
      - name: Remove only this registered stopped N01 project and preserve volume
        if: ${{ always() && steps.n01.outputs.private_directory != '' }}
        id: n01_cleanup
        shell: bash
        env:
          N01_CI_PRIVATE_DIRECTORY: ${{ steps.n01.outputs.private_directory }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          private = Path(os.environ["N01_CI_PRIVATE_DIRECTORY"]).resolve()
          stop = datetime.fromisoformat(os.environ["COMMERCEOPS_N01_STOP_AT_UTC"])
          path = private / "window.json"
          if not path.exists():
              print("N01 registration absent; no registered project to remove")
              raise SystemExit(0)
          assert not path.is_symlink() and path.stat().st_mode & 0o777 == 0o600
          assert path.stat().st_uid == os.getuid()
          window = json.loads(path.read_text())
          assert not private.is_symlink() and private.stat().st_mode & 0o777 == 0o700
          assert private.stat().st_uid == os.getuid()
          assert window["owner"] == "phase4-C09-Web" and window["owner_uid"] == os.getuid()
          assert window["checkout"] == str(root) and window["private_directory"] == str(private)
          assert window["source_commit"] == subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root, text=True).strip()
          assert datetime.fromisoformat(window["stop_at_utc"]) == stop
          assert re.fullmatch(r"p4c09-n01-[0-9a-f]{10}", window["project"])
          def run(command, limit=10):
              result = subprocess.run(command, cwd=root,
                                      env={**os.environ, "COMMERCEOPS_PG_RUNTIME_DIR": str(private)},
                                      capture_output=True, text=True, timeout=limit)
              if result.returncode:
                  raise RuntimeError("N01 registered project cleanup failed")
              return result.stdout
          project = window["project"]
          compose = ["docker", "compose", "--env-file", str(private / "compose-input.conf"), "-p", project,
                     "-f", str(root / "compose.yml"), "-f", str(private / "compose-port.json")]
          containers = run(["docker", "ps", "-a", "-q", "--filter", "label=com.docker.compose.project=" + project]).split()
          volumes = set()
          for container in containers:
              info = json.loads(run(["docker", "inspect", container]))[0]
              labels = info["Config"]["Labels"]
              assert labels["com.docker.compose.project"] == project
              assert labels["com.docker.compose.project.working_dir"] == str(root)
              assert labels["com.docker.compose.project.config_files"] == str(root / "compose.yml") + "," + str(private / "compose-port.json")
              volumes.update(m["Name"] for m in info["Mounts"] if m["Type"] == "volume")
          run(compose + ["stop", "--timeout", "5"], 15)
          for container in containers:
              state = json.loads(run(["docker", "inspect", container]))[0]["State"]
              assert state["Running"] is False and state["Pid"] == 0
          run(compose + ["down", "--timeout", "5"], 30)
          assert not run(["docker", "ps", "-a", "-q", "--filter", "label=com.docker.compose.project=" + project]).split()
          assert not run(["docker", "network", "ls", "-q", "--filter", "label=com.docker.compose.project=" + project]).split()
          for volume in volumes:
              assert json.loads(run(["docker", "volume", "inspect", volume]))[0]["Name"] == volume
          result = {"containers": 0, "networks": 0, "volume_preserved": bool(volumes), "down_exit": 0,
                    "stopped_at_utc": datetime.now(timezone.utc).isoformat()}
          (private / "ci-cleanup.safe.json").write_text(json.dumps(result))
          (private / "ci-cleanup.safe.json").chmod(0o600)
          assert datetime.fromisoformat(result["stopped_at_utc"]) <= stop
          print("Current registered N01 project removed; containers0/networks0; volume retained")
          PY
      - name: Validate only current-source closed failure diagnostic
        id: n01_failure_evidence
        if: ${{ always() && steps.n01.outcome == 'failure' }}
        shell: bash
        env:
          COMMERCEOPS_FAILURE_PRIVATE_DIRECTORY: ${{ steps.n01.outputs.private_directory }}
        run: |
          "$GITHUB_WORKSPACE/.tools/node/bin/node" --input-type=module - <<'JS'
          import { readFileSync, writeFileSync, appendFileSync, lstatSync, existsSync } from "node:fs";
          import { resolve, join } from "node:path";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          try {
            const root = process.env.GITHUB_WORKSPACE;
            if (resolve(root) !== process.cwd()) throw new Error();
            const read = (path) => {
              const info = lstatSync(path);
              if (!info.isFile() || info.isSymbolicLink() || info.uid !== process.getuid() ||
                  (info.mode & 0o777) !== 0o600 || info.size > 131072) throw new Error();
              return JSON.parse(readFileSync(path, "utf8"));
            };
            const ctx = read(join(root, ".audit/live-failure-context.safe.json"));
            const fields = ["schema_version", "source_commit", "source_tree", "job", "run_id", "run_attempt", "build_id", "registered_at_utc", "stop_at_utc"];
            if (Object.keys(ctx).sort().join() !== fields.sort().join() || ctx.schema_version !== "ci-live-failure-binding-v1") throw new Error();
            const job = process.env.GITHUB_JOB;
            if (!["frontend", "n01-web"].includes(job) || ctx.job !== job ||
                ctx.run_id !== process.env.GITHUB_RUN_ID || ctx.run_attempt !== process.env.GITHUB_RUN_ATTEMPT) throw new Error();
            const git = (ref) => execFileSync("git", ["rev-parse", ref], { cwd: root, encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }).trim();
            if (ctx.source_commit !== git("HEAD") || ctx.source_tree !== git("HEAD^{tree}") ||
                ctx.build_id !== readFileSync(join(root, "frontend/.next/BUILD_ID"), "utf8").trim()) throw new Error();
            const stopName = job === "n01-web" ? "COMMERCEOPS_N01_STOP_AT_UTC" : "COMMERCEOPS_FRONTEND_STOP_AT_UTC";
            if (ctx.stop_at_utc !== process.env[stopName]) throw new Error();
            const began = Date.parse(ctx.registered_at_utc), stop = Date.parse(ctx.stop_at_utc);
            if (!Number.isFinite(began) || !Number.isFinite(stop) || began >= stop) throw new Error();
            const privateRoot = process.env.COMMERCEOPS_FAILURE_PRIVATE_DIRECTORY;
            if (typeof privateRoot !== "string" || resolve(privateRoot) !== privateRoot) throw new Error();
            const own = lstatSync(privateRoot);
            if (!own.isDirectory() || own.isSymbolicLink() || own.uid !== process.getuid() || (own.mode & 0o777) !== 0o700) throw new Error();
            const stages = job === "n01-web" ? ["n01"] : ["read", "write", "items"];
            const paths = {
              read: "frontend/evidence/b04-live/read/failure-diagnostic.safe.json",
              write: "frontend/evidence/b04-live/write/failure-diagnostic.safe.json",
              items: "frontend/evidence/b04-live/failure-diagnostic.safe.json",
              n01: "frontend/evidence/p4-c09/n01/failure-diagnostic.safe.json",
            };
            const observed = stages.filter((stage) => existsSync(join(privateRoot, ...(job === "n01-web" ? [] : [stage]), "window.json")));
            if (!observed.length || observed.join() !== stages.slice(0, observed.length).join()) throw new Error();
            const stage = observed.at(-1);
            const directory = job === "n01-web" ? privateRoot : join(privateRoot, stage);
            const window = read(join(directory, "window.json"));
            const started = Date.parse(window.started_at_utc);
            if (window.owner !== (job === "n01-web" ? "phase4-C09-Web" : "phase3-WebCI") ||
                window.owner_uid !== process.getuid() || window.checkout !== root || window.private_directory !== directory ||
                window.source_commit !== ctx.source_commit || window.build_id !== ctx.build_id ||
                window.stop_at_utc !== ctx.stop_at_utc || !Number.isFinite(started) || started < began || started >= stop) throw new Error();
            if (job === "frontend" && window.stage !== stage) throw new Error();
            const path = paths[stage], absolute = join(root, path);
            const diagnostic = read(absolute), captured = Date.parse(diagnostic.captured_at_utc);
            const { liveFailurePolicy, validLiveFailureDiagnostic } = await import("./frontend/tooling/live-reporter.ts");
            if (!validLiveFailureDiagnostic(diagnostic, liveFailurePolicy()) || diagnostic.stage !== stage ||
                !Number.isFinite(captured) || captured < started || captured > stop ||
                lstatSync(absolute).mtimeMs < started ||
                (diagnostic.status === "passed" && !(diagnostic.rejected_result_count > 0 || diagnostic.global_error_count > 0))) throw new Error();
            const metadata = {
              ...ctx, job_outcome: "failure", gate_passed: false, stage, report_status: diagnostic.status,
              observed_stages: observed, unstarted_stages: stages.slice(observed.length),
              diagnostic_path: path, diagnostic_sha256: createHash("sha256").update(readFileSync(absolute)).digest("hex"),
              stage_started_at_utc: window.started_at_utc, captured_at_utc: diagnostic.captured_at_utc,
            };
            writeFileSync(join(root, ".audit/live-failure-binding.safe.json"), JSON.stringify(metadata, null, 2) + "\n", { mode: 0o600, flag: "wx" });
            appendFileSync(process.env.GITHUB_OUTPUT, "sidecar_path=" + path + "\n");
            console.log("Current-source closed failure diagnostic accepted; job remains failure");
          } catch {
            console.error("Failure evidence missing or rejected; actual test counts remain unknown");
            process.exitCode = 1;
          }
          JS
      - name: Upload only verified failure sidecar and minimal binding
        if: ${{ always() && steps.n01.outcome == 'failure' && steps.n01_failure_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        with:
          name: n01-web-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.n01_failure_evidence.outputs.sidecar_path }}
            .audit/live-failure-binding.safe.json
          if-no-files-found: error
          retention-days: 1
      - name: Require current source six passes PG invariants and complete stop proof
        id: n01_evidence
        shell: bash
        env:
          N01_CI_PRIVATE_DIRECTORY: ${{ steps.n01.outputs.private_directory }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          private = Path(os.environ["N01_CI_PRIVATE_DIRECTORY"]).resolve()
          stop = datetime.fromisoformat(os.environ["COMMERCEOPS_N01_STOP_AT_UTC"])
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root, text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], cwd=root, text=True).strip()
          build = (root / "frontend/.next/BUILD_ID").read_text().strip()
          def read(name):
              path = private / name
              assert not path.is_symlink() and path.stat().st_mode & 0o777 == 0o600
              assert path.stat().st_uid == os.getuid()
              return json.loads(path.read_text())
          window, manifest, imports, cleanup = (read(name) for name in (
              "window.json",
              "source-files.safe.json",
              "api-imports.safe.json",
              "ci-cleanup.safe.json"))
          assert window["owner"] == "phase4-C09-Web" and window["owner_uid"] == os.getuid()
          assert window["checkout"] == str(root) and window["private_directory"] == str(private)
          assert window["source_commit"] == commit and window["build_id"] == build
          assert window["status"] == "stopped" and window["passed"] is True and window["test_exit"] == 0
          assert window.get("failure_category") is None and window["max_new_cycle_requests"] == 1
          assert window["worker_started"] is False and window["sdk_provider_started"] is False
          assert window["pg_container_created"] is True and window["pg_running"] is False and window["pg_pid"] == 0
          assert window["owned_listeners_remaining"] is False and window["volume_preserved"] is True
          assert datetime.fromisoformat(window["stop_at_utc"]) == stop
          assert datetime.fromisoformat(window["started_at_utc"]) < datetime.fromisoformat(window["stopped_at_utc"]) <= stop
          assert window["child_exit_codes"] and all(type(code) is int and code in (0, -15, 143) for code in window["child_exit_codes"])
          assert cleanup["containers"] == cleanup["networks"] == cleanup["down_exit"] == 0
          assert cleanup["volume_preserved"] is True and datetime.fromisoformat(cleanup["stopped_at_utc"]) <= stop
          public = root / "frontend/evidence/p4-c09/n01"
          outputs = {str((public / name).relative_to(root)) for name in (
              "live-results.json", "pg-invariants.safe.json", "resource-stop.safe.json",
              "failure-diagnostic.safe.json")}
          sources = set(subprocess.check_output(["git", "ls-files", "frontend", "tests/e2e/web"], cwd=root, text=True).splitlines()) - outputs
          assert set(manifest) == sources
          assert hashlib.sha256((private / "source-files.safe.json").read_bytes()).hexdigest() == window["source_manifest_sha256"]
          assert all(hashlib.sha256((root / name).read_bytes()).hexdigest() == digest for name, digest in manifest.items())
          modules = {"application/replenishment/nl_preflight.py", "infrastructure/web_preflight.py",
                     "entrypoints/replenishment_http.py", "entrypoints/web_openapi.py"}
          assert set(imports) == {"pid", "four_imports_match", "hashes"}
          assert imports["pid"] == window["api_pid"] and imports["four_imports_match"] is True
          assert set(imports["hashes"]) == modules
          assert all(hashlib.sha256((root / "backend/src/commerceops" / name).read_bytes()).hexdigest() == digest for name, digest in imports["hashes"].items())
          report = json.loads((public / "live-results.json").read_text())
          assert set(report) == {"status", "duration_ms", "trace", "video", "automatic_screenshot", "source_mode", "commerce_source_mode", "identity_mode", "tests"}
          assert report["status"] == "passed" and report["source_mode"] == "live-api"
          assert report["commerce_source_mode"] == "mock-fixture" and report["identity_mode"] == "session"
          assert all(report[key] == "off" for key in ("trace", "video", "automatic_screenshot"))
          spec = root / "tests/e2e/web/live/n01.spec.ts"
          titles = re.findall(r'^test\("([^"]+)"', spec.read_text(), re.M)
          assert len(titles) == len(set(titles)) == len(report["tests"]) == 6
          assert sorted(row["test"] for row in report["tests"]) == sorted(titles)
          assert all(set(row) == {"test", "status", "duration_ms", "location"} and row["status"] == "passed" for row in report["tests"])
          invariants = json.loads((public / "pg-invariants.safe.json").read_text())
          assert set(invariants) == {"source", "worker", "sdk_provider", "tests"}
          assert invariants["source"] == "actual owned PostgreSQL" and invariants["worker"] == invariants["sdk_provider"] == "not_started"
          assert len(invariants["tests"]) == 6 and sorted(row["test"] for row in invariants["tests"]) == sorted(titles)
          assert all(set(row) == {"test", "business_unchanged", "explicit_pair_only"} and type(row["business_unchanged"]) is bool and type(row["explicit_pair_only"]) is bool for row in invariants["tests"])
          assert sum(row["explicit_pair_only"] for row in invariants["tests"]) == 1
          assert all(row["explicit_pair_only"] is ("显式唯一创建" in row["test"]) and row["business_unchanged"] is ("显式唯一创建" not in row["test"]) for row in invariants["tests"])
          summary = json.loads((public / "resource-stop.safe.json").read_text())
          fields = {"passed", "source_commit", "build_id", "test_exit", "failure_category", "pg_running", "pg_pid",
                    "owned_listeners_remaining", "volume_preserved", "worker_started", "sdk_provider_started",
                    "started_at_utc", "stop_at_utc", "stopped_at_utc"}
          assert set(summary) == fields and all(summary[key] == window.get(key) for key in fields)
          summary.update(source_tree=tree, source_hashes_match=True, four_api_imports_match=True,
                         source_manifest_sha256=window["source_manifest_sha256"],
                         api_module_hashes=imports["hashes"], actual_api_pid=imports["pid"],
                         child_exit_codes=window["child_exit_codes"],
                         containers=cleanup["containers"], networks=cleanup["networks"], down_exit=cleanup["down_exit"],
                         project_removed_at_utc=cleanup["stopped_at_utc"])
          (public / "resource-stop.safe.json").write_text(json.dumps(summary, sort_keys=True, indent=2) + "\n")
          print("Current-source N01 six cases passed; PG invariants and complete stop verified")
          PY
      - name: Upload only three verified safe N01 reports
        if: ${{ success() && steps.n01_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        with:
          name: n01-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/evidence/p4-c09/n01/live-results.json
            frontend/evidence/p4-c09/n01/pg-invariants.safe.json
            frontend/evidence/p4-c09/n01/resource-stop.safe.json
          if-no-files-found: error
          retention-days: 1
  phase3:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Register absolute diagnostic deadline
        run: |
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          directory = Path(".audit")
          directory.mkdir(exist_ok=True)
          (directory / "ci-deadline").write_text(
              (datetime.now(timezone.utc) + timedelta(minutes=33)).isoformat()
          )
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.25'
          enable-cache: false
      - name: Fixed project tools with SHA256 verification
        run: python -m scripts.bootstrap_tools
      - name: Secrets gate before dependency installation
        run: python -m scripts.scan_secrets
      - name: Install locked Python environment
        run: uv sync --frozen
      - name: All P3 modules from the complete integration collection
        run: |
          uv run --frozen python -m scripts.pg_diagnostic \
            --session ci --round 1 --combined --ci-scope phase3 --no-child-trace \
            --deadline "$(cat .audit/ci-deadline)"
      - name: Upload only safe P3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        with:
          name: pg-phase3-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audit/ci-evidence-phase3.json
          if-no-files-found: error
          retention-days: 1
  pg-pair:
    needs: [quality, phase3]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # official v4
        with:
          name: pg-existing-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audit/pg-pair/existing
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # official v4
        with:
          name: pg-phase3-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audit/pg-pair/phase3
      - name: Verify both source-bound partitions and complete actual union
        run: |
          test '${{ needs.quality.result }}' = success
          test '${{ needs.phase3.result }}' = success
          python -m scripts.pg_ci_evidence \
            .audit/pg-pair/existing/ci-evidence-existing.json \
            .audit/pg-pair/phase3/ci-evidence-phase3.json
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Register immutable frontend deadline before checkout
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          stop = (datetime.now(timezone.utc) + timedelta(minutes=23)).isoformat()
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"COMMERCEOPS_FRONTEND_STOP_AT_UTC={stop}\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.25'
          enable-cache: false
      - name: Locked tools schema contracts build and headless Mock pages
        shell: bash
        run: |
          # All preparation shares the first-step deadline. Keep 75 seconds for
          # cleanup even if a timed-out command needs its 10-second kill grace.
          run_before_cleanup() {
            local remaining
            remaining=$(python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          stop = datetime.fromisoformat(os.environ["COMMERCEOPS_FRONTEND_STOP_AT_UTC"])
          print(int((stop - datetime.now(timezone.utc)).total_seconds()) - 85)
          PY
            )
            test "$remaining" -gt 0
            timeout --signal=TERM --kill-after=10 "${remaining}s" "$@"
          }
          export PATH="$GITHUB_WORKSPACE/.tools/node/bin:$PATH"
          run_before_cleanup python -m scripts.bootstrap_tools
          run_before_cleanup python -m scripts.scan_secrets
          run_before_cleanup uv sync --frozen
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
          cd "$GITHUB_WORKSPACE/frontend"
          run_before_cleanup npm ci --ignore-scripts
          run_before_cleanup npm run check:toolchain
          run_before_cleanup npm run typecheck
          run_before_cleanup npm run check:read-schema
          run_before_cleanup npm run test:contract
          run_before_cleanup npm audit --audit-level=low
          run_before_cleanup npm run build
          run_before_cleanup npm exec -- playwright install --with-deps chromium
          run_before_cleanup npm run test:web
          run_before_cleanup npm exec -- playwright test --config playwright.b04-offline.config.ts
          run_before_cleanup npm exec -- playwright test --config ../tests/e2e/web/phase4/playwright.config.ts
      - name: All real PG API headless read write and items batches
        id: live
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          export PATH="$GITHUB_WORKSPACE/.tools/node/bin:$PATH"
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          stop = datetime.fromisoformat(os.environ["COMMERCEOPS_FRONTEND_STOP_AT_UTC"])
          if (stop - datetime.now(timezone.utc)).total_seconds() <= 85:
              raise SystemExit("Frontend resource window has no cleanup reserve")
          PY
          umask 077
          private_directory=$(mktemp -d "$RUNNER_TEMP/commerceops-web-XXXXXX")
          printf 'private_directory=%s\n' "$private_directory" >> "$GITHUB_OUTPUT"
          # Remove only the three known reporter samples so validation cannot
          # inherit a committed author's result if this run produces none.
          rm -f frontend/evidence/b04-live/read/live-results.json \
            frontend/evidence/b04-live/write/live-results.json \
            frontend/evidence/b04-live/live-results.json
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          job = os.environ["GITHUB_JOB"]
          stop_name = "COMMERCEOPS_N01_STOP_AT_UTC" if job == "n01-web" else "COMMERCEOPS_FRONTEND_STOP_AT_UTC"
          assert job in {"n01-web", "frontend"}
          audit = root / ".audit"
          audit.mkdir(exist_ok=True)
          assert not audit.is_symlink()
          context = {
              "schema_version": "ci-live-failure-binding-v1",
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root, text=True).strip(),
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], cwd=root, text=True).strip(),
              "job": job,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "build_id": (root / "frontend/.next/BUILD_ID").read_text().strip(),
              "registered_at_utc": datetime.now(timezone.utc).isoformat(),
              "stop_at_utc": os.environ[stop_name],
          }
          with (audit / "live-failure-context.safe.json").open("x") as output:
              json.dump(context, output, sort_keys=True)
          (audit / "live-failure-context.safe.json").chmod(0o600)
          PY
          # The frozen entry reserves 75 seconds and stops each owned batch.
          # Run all three stages without a filter or any reused private inputs.
          uv run --frozen python -m tests.e2e.web.run_live_batches \
            --checkout "$GITHUB_WORKSPACE" \
            --private-directory "$private_directory" \
            --owner ci \
            --stop-at-utc "$COMMERCEOPS_FRONTEND_STOP_AT_UTC"
      - name: Validate only current-source closed failure diagnostic
        id: frontend_failure_evidence
        if: ${{ always() && steps.live.outcome == 'failure' }}
        shell: bash
        env:
          COMMERCEOPS_FAILURE_PRIVATE_DIRECTORY: ${{ steps.live.outputs.private_directory }}
        run: |
          "$GITHUB_WORKSPACE/.tools/node/bin/node" --input-type=module - <<'JS'
          import { readFileSync, writeFileSync, appendFileSync, lstatSync, existsSync } from "node:fs";
          import { resolve, join } from "node:path";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          try {
            const root = process.env.GITHUB_WORKSPACE;
            if (resolve(root) !== process.cwd()) throw new Error();
            const read = (path) => {
              const info = lstatSync(path);
              if (!info.isFile() || info.isSymbolicLink() || info.uid !== process.getuid() ||
                  (info.mode & 0o777) !== 0o600 || info.size > 131072) throw new Error();
              return JSON.parse(readFileSync(path, "utf8"));
            };
            const ctx = read(join(root, ".audit/live-failure-context.safe.json"));
            const fields = ["schema_version", "source_commit", "source_tree", "job", "run_id", "run_attempt", "build_id", "registered_at_utc", "stop_at_utc"];
            if (Object.keys(ctx).sort().join() !== fields.sort().join() || ctx.schema_version !== "ci-live-failure-binding-v1") throw new Error();
            const job = process.env.GITHUB_JOB;
            if (!["frontend", "n01-web"].includes(job) || ctx.job !== job ||
                ctx.run_id !== process.env.GITHUB_RUN_ID || ctx.run_attempt !== process.env.GITHUB_RUN_ATTEMPT) throw new Error();
            const git = (ref) => execFileSync("git", ["rev-parse", ref], { cwd: root, encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }).trim();
            if (ctx.source_commit !== git("HEAD") || ctx.source_tree !== git("HEAD^{tree}") ||
                ctx.build_id !== readFileSync(join(root, "frontend/.next/BUILD_ID"), "utf8").trim()) throw new Error();
            const stopName = job === "n01-web" ? "COMMERCEOPS_N01_STOP_AT_UTC" : "COMMERCEOPS_FRONTEND_STOP_AT_UTC";
            if (ctx.stop_at_utc !== process.env[stopName]) throw new Error();
            const began = Date.parse(ctx.registered_at_utc), stop = Date.parse(ctx.stop_at_utc);
            if (!Number.isFinite(began) || !Number.isFinite(stop) || began >= stop) throw new Error();
            const privateRoot = process.env.COMMERCEOPS_FAILURE_PRIVATE_DIRECTORY;
            if (typeof privateRoot !== "string" || resolve(privateRoot) !== privateRoot) throw new Error();
            const own = lstatSync(privateRoot);
            if (!own.isDirectory() || own.isSymbolicLink() || own.uid !== process.getuid() || (own.mode & 0o777) !== 0o700) throw new Error();
            const stages = job === "n01-web" ? ["n01"] : ["read", "write", "items"];
            const paths = {
              read: "frontend/evidence/b04-live/read/failure-diagnostic.safe.json",
              write: "frontend/evidence/b04-live/write/failure-diagnostic.safe.json",
              items: "frontend/evidence/b04-live/failure-diagnostic.safe.json",
              n01: "frontend/evidence/p4-c09/n01/failure-diagnostic.safe.json",
            };
            const observed = stages.filter((stage) => existsSync(join(privateRoot, ...(job === "n01-web" ? [] : [stage]), "window.json")));
            if (!observed.length || observed.join() !== stages.slice(0, observed.length).join()) throw new Error();
            const stage = observed.at(-1);
            const directory = job === "n01-web" ? privateRoot : join(privateRoot, stage);
            const window = read(join(directory, "window.json"));
            const started = Date.parse(window.started_at_utc);
            if (window.owner !== (job === "n01-web" ? "phase4-C09-Web" : "phase3-WebCI") ||
                window.owner_uid !== process.getuid() || window.checkout !== root || window.private_directory !== directory ||
                window.source_commit !== ctx.source_commit || window.build_id !== ctx.build_id ||
                window.stop_at_utc !== ctx.stop_at_utc || !Number.isFinite(started) || started < began || started >= stop) throw new Error();
            if (job === "frontend" && window.stage !== stage) throw new Error();
            const path = paths[stage], absolute = join(root, path);
            const diagnostic = read(absolute), captured = Date.parse(diagnostic.captured_at_utc);
            const { liveFailurePolicy, validLiveFailureDiagnostic } = await import("./frontend/tooling/live-reporter.ts");
            if (!validLiveFailureDiagnostic(diagnostic, liveFailurePolicy()) || diagnostic.stage !== stage ||
                !Number.isFinite(captured) || captured < started || captured > stop ||
                lstatSync(absolute).mtimeMs < started ||
                (diagnostic.status === "passed" && !(diagnostic.rejected_result_count > 0 || diagnostic.global_error_count > 0))) throw new Error();
            const metadata = {
              ...ctx, job_outcome: "failure", gate_passed: false, stage, report_status: diagnostic.status,
              observed_stages: observed, unstarted_stages: stages.slice(observed.length),
              diagnostic_path: path, diagnostic_sha256: createHash("sha256").update(readFileSync(absolute)).digest("hex"),
              stage_started_at_utc: window.started_at_utc, captured_at_utc: diagnostic.captured_at_utc,
            };
            writeFileSync(join(root, ".audit/live-failure-binding.safe.json"), JSON.stringify(metadata, null, 2) + "\n", { mode: 0o600, flag: "wx" });
            appendFileSync(process.env.GITHUB_OUTPUT, "sidecar_path=" + path + "\n");
            console.log("Current-source closed failure diagnostic accepted; job remains failure");
          } catch {
            console.error("Failure evidence missing or rejected; actual test counts remain unknown");
            process.exitCode = 1;
          }
          JS
      - name: Upload only verified failure sidecar and minimal binding
        if: ${{ always() && steps.live.outcome == 'failure' && steps.frontend_failure_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        with:
          name: frontend-live-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.frontend_failure_evidence.outputs.sidecar_path }}
            .audit/live-failure-binding.safe.json
          if-no-files-found: error
          retention-days: 1
      - name: Require complete current-source live results and stopped resources
        id: frontend_evidence
        shell: bash
        env:
          FRONTEND_CI_PRIVATE_DIRECTORY: ${{ steps.live.outputs.private_directory }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          private = Path(os.environ["FRONTEND_CI_PRIVATE_DIRECTORY"]).resolve()
          stop = datetime.fromisoformat(os.environ["COMMERCEOPS_FRONTEND_STOP_AT_UTC"])
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root, text=True).strip()
          build = (root / "frontend/.next/BUILD_ID").read_text().strip()
          result = json.loads((private / "result.json").read_text())
          assert set(result) == {"stop_at_utc", "stages"}
          assert datetime.fromisoformat(result["stop_at_utc"]) == stop
          assert [row["stage"] for row in result["stages"]] == ["read", "write", "items"]
          window_fields = {
              "project", "owner", "owner_uid", "checkout", "private_directory", "stage",
              "started_at_utc", "stop_at_utc", "pg_port", "web_origin", "api_origin",
              "build_id", "source_commit", "status", "source_files_sha256", "seed_pid",
              "seed_exit", "worker_pid", "api_pid", "web_pid", "test_pid", "test_exit",
              "invariants", "model_calls", "actual_provider_calls", "stopped_at_utc",
              "pg_running", "pg_pid", "child_exit_codes", "volume_preserved",
              "owned_listeners_remaining",
          }
          reporter_fields = {
              "status", "duration_ms", "trace", "video", "automatic_screenshot",
              "source_mode", "commerce_source_mode", "identity_mode", "tests",
          }
          source_files = {
              "tests/e2e/web/run_live_batches.py", "tests/e2e/web/live_batch_owner.py",
              "tests/e2e/web/live_batch_audit.py", "tests/e2e/web/live_item_seed.py",
              "tests/e2e/web/live_item_worker.py", "tests/e2e/web/live_item_revoke.py",
              "tests/e2e/web/live_write_probe.py", "tests/e2e/web/live/read.spec.ts",
              "tests/e2e/web/live/write.spec.ts", "tests/e2e/web/live/items.spec.ts",
              "frontend/tooling/live-reporter.ts", "frontend/tooling/live-zoom-proof.mjs",
              "frontend/playwright.live.config.ts",
              "frontend/tooling/live-failure.schema.json",
          }
          for row, (stage, count, report_path) in zip(result["stages"], (
              ("read", 7, "frontend/evidence/b04-live/read/live-results.json"),
              ("write", 10, "frontend/evidence/b04-live/write/live-results.json"),
              ("items", 7, "frontend/evidence/b04-live/live-results.json"),
          ), strict=True):
              assert set(row) == {
                  "stage", "passed", "project", "actual_provider_calls", "test_exit",
                  "pg_running", "pg_pid", "failure_category", "invariants_passed", "native_zoom",
              }
              assert row["passed"] is True and row["invariants_passed"] is True
              assert row["test_exit"] == 0 and row["actual_provider_calls"] == 0
              assert row["pg_running"] is False and row["pg_pid"] == 0
              assert row["failure_category"] is None
              window = json.loads((private / stage / "window.json").read_text())
              assert set(window) == window_fields | ({"native_zoom"} if stage == "items" else set())
              assert window["stage"] == stage and window["project"] == row["project"]
              assert window["owner"] == "phase3-WebCI" and window["owner_uid"] == os.getuid()
              assert window["checkout"] == str(root) and window["private_directory"] == str(private / stage)
              assert window["source_commit"] == commit and window["build_id"] == build
              assert datetime.fromisoformat(window["stop_at_utc"]) == stop
              assert datetime.fromisoformat(window["started_at_utc"]) < datetime.fromisoformat(window["stopped_at_utc"]) <= stop
              assert window["status"] == "stopped" and window["seed_exit"] == window["test_exit"] == 0
              assert window["pg_running"] is False and window["pg_pid"] == 0
              assert window["owned_listeners_remaining"] is False and window["volume_preserved"] is True
              assert window["child_exit_codes"] and all(type(code) is int and code in (0, -15, 143) for code in window["child_exit_codes"])
              assert window["model_calls"] == window["actual_provider_calls"] == 0
              assert window["invariants"]["stage"] == stage and window["invariants"]["passed"] is True
              assert set(window["source_files_sha256"]) == source_files
              for source_path, expected_hash in window["source_files_sha256"].items():
                  source = (root / source_path).resolve()
                  assert source.is_relative_to(root)
                  assert hashlib.sha256(source.read_bytes()).hexdigest() == expected_hash
              if stage == "items":
                  assert window["native_zoom"] == row["native_zoom"] == "passed"
              report = json.loads((root / report_path).read_text())
              assert set(report) == reporter_fields and report["status"] == "passed"
              assert all(report[key] == "off" for key in ("trace", "video", "automatic_screenshot"))
              assert report["source_mode"] == "live-api"
              assert report["commerce_source_mode"] == "mock-fixture"
              assert report["identity_mode"] == "session"
              expected = re.findall(r'^test\("([^"]+)"', (root / f"tests/e2e/web/live/{stage}.spec.ts").read_text(), re.M)
              tests = report["tests"]
              assert len(expected) == len(set(expected)) == len(tests) == count
              assert sorted(test["test"] for test in tests) == sorted(expected)
              assert all(set(test) == {"test", "status", "duration_ms", "location"} and test["status"] == "passed" for test in tests)
          print("Current-source live suites complete: read7/write10/items7; all owned stages stopped")
          PY
      - name: Upload only four verified safe live metadata files
        if: ${{ success() && steps.frontend_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        with:
          name: frontend-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.live.outputs.private_directory }}/read/window.json
            ${{ steps.live.outputs.private_directory }}/write/window.json
            ${{ steps.live.outputs.private_directory }}/items/window.json
            ${{ steps.live.outputs.private_directory }}/result.json
          if-no-files-found: error
          retention-days: 1
