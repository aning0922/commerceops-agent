[project]
name = "commerceops-agent"
version = "0.1.0"
description = "CommerceOps modular monolith foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "SQLAlchemy==2.1.4",
  "psycopg[binary]==3.3.6",
  "langgraph-checkpoint-postgres==3.1.2",
  "langgraph==1.2.14",
  "fastapi==0.142.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.54.0",
  "lark-oapi==1.7.3",
]

[project.scripts]
commerceops-api = "commerceops.entrypoints.api:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/commerceops"]

[dependency-groups]
dev = [
  "hatchling==1.32.4",
  "httpx==0.28.1",
  "markdown-it-py==4.2.0",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
  "tomli-w==1.2.0",
]

[tool.uv]
required-version = "==0.11.25"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "backend/src"
files = ["backend/src", "backend/migrations", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
  "offline: deterministic checks without external services",
  "integration: requires real PostgreSQL or other explicitly provisioned infrastructure",
  "external: requires real platform credentials and explicit runtime configuration",
]
