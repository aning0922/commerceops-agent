<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">CommerceOps Agent</title>
  <desc id="description">A product identity illustration connecting inventory analysis, human review, internal execution and reconciliation. This is a conceptual workflow, not a product screenshot.</desc>
  <defs>
