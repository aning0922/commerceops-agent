    <rect x="1070" y="49" width="156" height="30" rx="15" fill="#103C38" stroke="#28594F"/>
    <circle cx="1088" cy="64" r="3.5" fill="#72E4B7"/>
    <text x="1101" y="69" fill="#BBF7D0" font-size="11" font-weight="700" letter-spacing="1.6">M1 · ACCEPTED</text>
    <text x="52" y="158" fill="#F2F8F9" font-size="64" font-weight="700" letter-spacing="-2">CommerceOps<tspan fill="#6EE7CB"> Agent</tspan></text>
    <text x="56" y="199" fill="#A6C0C7" font-size="21" letter-spacing="0.2">From inventory insights to accountable action.</text>
    <path d="M54 303H1226" stroke="url(#line)" stroke-width="2"/>
    <g>
      <rect x="54" y="253" width="266" height="104" rx="14" fill="#102B38" stroke="#284451"/>
      <text x="76" y="284" fill="#6FDCCB" font-size="11" font-weight="600" letter-spacing="2">01 / ANALYZE</text>
      <text x="76" y="316" fill="#EEF6F8" font-size="20" font-weight="600">Deterministic insights</text>
      <text x="76" y="339" fill="#91AEB8" font-size="12">Frozen facts. Traceable rules.</text>
    </g>
    <g>
      <rect x="356" y="253" width="266" height="104" rx="14" fill="#102F3A" stroke="#2F4C56"/>
      <text x="378" y="284" fill="#6FDCCB" font-size="11" font-weight="600" letter-spacing="2">02 / REVIEW</text>
      <text x="378" y="316" fill="#EEF6F8" font-size="20" font-weight="600">Human decisions</text>
      <text x="378" y="339" fill="#91AEB8" font-size="12">Full disclosure. Explicit approval.</text>
    </g>
    <g>
      <rect x="658" y="253" width="266" height="104" rx="14" fill="#11343C" stroke="#325459"/>
      <text x="680" y="284" fill="#6FDCCB" font-size="11" font-weight="600" letter-spacing="2">03 / EXECUTE</text>
      <text x="680" y="316" fill="#EEF6F8" font-size="20" font-weight="600">Internal work items</text>
      <text x="680" y="339" fill="#91AEB8" font-size="12">Atomic writes. Durable receipts.</text>
    </g>
