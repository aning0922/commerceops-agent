      <stop stop-color="#0A1928"/>
      <stop offset="0.6" stop-color="#0C2530"/>
      <stop offset="1" stop-color="#103E3D"/>
    </linearGradient>
    <linearGradient id="line" x1="54" y1="316" x2="1226" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#5EEAD4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#91C6C0" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#background)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="1164" cy="82" r="130" stroke="#5EEAD4" stroke-opacity="0.07"/>
  <circle cx="1164" cy="82" r="180" stroke="#5EEAD4" stroke-opacity="0.04"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="54" y="46" width="42" height="42" rx="12" fill="#153F42" stroke="#37635F"/>
